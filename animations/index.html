<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bot animations</title>
    <style>
      body {
        margin: 0;
        font-family: "Trebuchet MS", sans-serif;
        background: #d7f3ff;
        color: #1b2838;
      }
      header { text-align: center; padding: 24px 16px 8px; }
      h1 { margin: 0 0 8px; }
      .row { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; padding: 16px; }
      figure { margin: 0; max-width: 420px; }
      figcaption { font-weight: 800; margin-bottom: 8px; }
      video { width: 100%; border-radius: 18px; background: #16324a; }
      .wide { max-width: 920px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Before and after</h1>
      <p>Same roads. The first bot only looks one hop ahead and gets hit by the train. The second plans ahead, scores about twice as fast, and never dies.</p>
    </header>
    <div class="row">
      <figure class="wide">
        <figcaption>Side by side</figcaption>
        <video src="compare.webm" autoplay loop muted playsinline controls></video>
      </figure>
      <figure>
        <figcaption>Before</figcaption>
        <video src="before.webm" autoplay loop muted playsinline controls></video>
      </figure>
      <figure>
        <figcaption>After</figcaption>
        <video src="after.webm" autoplay loop muted playsinline controls></video>
      </figure>
    </div>
  </body>
</html>
